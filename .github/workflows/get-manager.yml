name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "Build channel: Stable (Release) matches official releases; Latest (HEAD) follows the latest upstream commit"
        required: false
        type: string
        default: "Stable (Release)"
      ksu_mode:
        description: "KernelSU / SUSFS mode (download the SUSFS module when Disabled)"
        required: false
        type: string
        default: "Disabled"
      use_nomount:
        description: "Enable the NoMount mount meta-module (download its companion module when enabled)"
        required: false
        type: boolean
        default: false
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_net_enhance:
        required: false
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        required: false
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces slot (off/678/123/345)"
        required: false
        type: string
        default: "off"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      artifact_upload_mode:
        required: false
        type: string
        default: "AnyKernel3.zip only"
      version:
        description: "Custom version name (leave blank for the default)"
        required: false
        type: string
        default: ""
      build_time:
        description: "Custom build time (leave blank to use the current Beijing time automatically)"
        required: false
        type: string
        default: ""
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

      managerVer:
        description: "Measured version code of the official Manager build"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}

      ksuCommit:
        description: "Commit SHA used to align the kernel (Stable channel = Release tag commit; Latest channel = selected CI build commit or HEAD)"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}

      channelTag:
        description: "Release tag selected by the Stable channel (empty for Latest channel or fallback)"
        value: ${{ jobs.get_ksu_manager.outputs.channelTag }}

      managerCertSize:
        description: "FinaSU manager signing certificate DER size (0x-prefixed hexadecimal, for the kernel second trust slot)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}

      managerCertHash:
        description: "FinaSU manager signing certificate SHA256 (for the kernel second trust slot)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    outputs:
      # Output 1: KSU version
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # Output 2: SUSFS version
      susVer: ${{ steps.get_version.outputs.sversion }}
      # Output 3: measured Manager version
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # Output 4: commit SHA used to align the kernel (Stable channel = Release tag commit; Latest channel = empty)
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # Output 5: Release tag selected by the Stable channel
      channelTag: ${{ steps.add_KSU.outputs.channelTag }}
      # Outputs 6/7: FinaSU manager signing certificate (for the kernel second trust slot)
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq unzip

      - name: Get KSU and SUSFS versions
        id: get_version
        if: inputs.ksu_mode != 'Disable KernelSU'
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "KernelSU" ]; then
            echo "This is the KernelSU variant"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # Calculate KSU version
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            # FinaSU kernel Kbuild and manager build.gradle.kts both calculate the version as 30000 + the Git commit count
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "KernelSU" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # Calculate SUSFS version
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # Export both values for the release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      # ==================== Build Channel ====================
      # Stable: use the official non-prerelease Release (tag commit and APK from that Release);
      #       if upstream has no stable Release (for example, BakaSU has only an rc prerelease),
      #       use the latest uploaded build from the official default branch, with the kernel pinned to that commit
      # Latest: use the latest build matching the default-branch HEAD version (any branch), and pin the kernel to that HEAD;
      #       BakaSU/FinaSU use the latest build from build-manager.yml directly, with the kernel pinned to its commit
      - name: Select manager source (build channel)
        id: channel
        run: |

          CHANNEL_RAW="${{ inputs.build_channel }}"
          case "$CHANNEL_RAW" in
            Latest*|latest*|HEAD*) CHANNEL_KIND="latest"; PIN_MODE="head" ;;
            *)                   CHANNEL_KIND="release"; PIN_MODE="pin" ;;
          esac
          echo "Build channel: $CHANNEL_RAW -> $CHANNEL_KIND (pin_mode=$PIN_MODE)"

          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU") REPO="SukiSU-Ultra/SukiSU-Ultra"; PREF="universal" ;;
            "BakaSU") REPO="Baka-SU/BakaSU";           PREF="arm64" ;;
            "FinaSU") REPO="LyraVoid/FinaSU";          PREF="universal" ;;
            "KernelSU") REPO="tiann/KernelSU";          PREF="universal" ;;
            *) echo "::error::Unknown variant"; exit 1 ;;
          esac

          {
            echo "CHANNEL_KIND=$CHANNEL_KIND"
            echo "PIN_MODE=$PIN_MODE"
            echo "MANAGER_REPO=$REPO"
            echo "MANAGER_SOURCE=ci"
          } >> "$GITHUB_ENV"

          if [ "$CHANNEL_KIND" != "release" ]; then
            echo "Latest channel: pin the kernel to the default-branch HEAD and select the latest manager build matching its version"
            exit 0
          fi

          # ---------- Stable channel: resolve the official Release ----------
          REL_JSON=""
          for ATTEMPT in 1 2 3; do
            REL_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=40") \
              && [ -n "$REL_JSON" ] && break
            echo "Failed to fetch the Release list for $REPO; retrying ($ATTEMPT/3)..."
            REL_JSON=""
            sleep 5
          done

          # Selection rules:
          #   1) Skip drafts and rolling tags (manager-ci / nightly / latest, etc., which always contain the newest CI artifacts)
          #   2) Keep only Releases with APK assets (exclude debug/spoofed packages)
          #   3) Accept only stable releases (prerelease=false); rc/beta prereleases belong to the Latest channel
          #   4) ABI preference: use arm64-v8a for BakaSU and prefer universal for other variants
          PICK=""
          if [ -n "$REL_JSON" ]; then
            PICK=$(printf '%s' "$REL_JSON" | jq -r --arg pref "$PREF" '
              [ .[] | select(.draft == false) ]
              | map(. + { _ts: (.published_at // .created_at // "") })
              | sort_by(._ts) | reverse
              | map(. + {
                  _rolling: (.tag_name | test("(?i)^(manager-ci|manager_ci|nightly|latest|ci)$")),
                  _apks: [ .assets[]?
                           | select(.name | test("\\.apk$"; "i"))
                           | select(.name | test("(?i)debug|spoofed") | not) ]
                })
              | map(. + {
                  _apks: (._apks | sort_by(
                    if   (.name | test("(?i)" + $pref)) then 0
                    elif (.name | test("(?i)universal")) then 1
                    elif (.name | test("(?i)arm64")) then 2
                    else 3 end))
                })
              | map(select((._rolling | not) and ((._apks | length) > 0)))
              | map(select(.prerelease | not))
              | .[0] as $p
              | if $p then
                  [ $p.tag_name, ( $p.prerelease | tostring ), $p._apks[0].name, $p._apks[0].browser_download_url ] | @tsv
                else empty end
            ')
          fi

          if [ -z "$PICK" ]; then
            echo "::notice::$REPO has no usable stable Release (only prereleases or no APK asset); using the latest uploaded build from the official default branch and keeping the kernel pinned to that commit"
            exit 0
          fi

          IFS=$'\t' read -r REL_TAG REL_PRE REL_APK_NAME REL_APK_URL <<< "$PICK"

          # Resolve the commit referenced by the Release tag (prefer the local clone, then query the remote)
          REL_COMMIT=$(git -C KernelSU rev-parse "${REL_TAG}^{commit}" 2>/dev/null || true)
          if [ -z "$REL_COMMIT" ]; then
            # Dereference annotated tags to get the commit rather than the tag object
            REL_COMMIT=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/${REL_TAG}^{}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            REL_COMMIT=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/${REL_TAG}" 2>/dev/null | awk '{print $1}')
          fi
          if [ -z "$REL_COMMIT" ]; then
            echo "::warning title=Stable channel fallback::Could not resolve the commit for Release $REL_TAG; using the latest uploaded build from the official default branch"
            exit 0
          fi

          {
            echo "MANAGER_SOURCE=release"
            echo "REL_TAG=$REL_TAG"
            echo "REL_COMMIT=$REL_COMMIT"
            echo "REL_APK_NAME=$REL_APK_NAME"
            echo "REL_APK_URL=$REL_APK_URL"
          } >> "$GITHUB_ENV"

          if [ "$REL_PRE" = "true" ]; then
            echo "::notice::No stable upstream release; selecting the latest prerelease $REL_TAG"
          fi
          echo "Stable channel: Release $REL_TAG (${REL_COMMIT:0:8}), manager $REL_APK_NAME"

      - name: Add KernelSU
        id: add_KSU
        if: inputs.ksu_mode != 'Disable KernelSU'
        continue-on-error: true
        run: bash scripts/get_manager.sh
        env:
          KERNELSU_VARIANT: ${{ inputs.kernelsu_variant }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
      - name: Download SUSFS module
        id: add_SUSFS
        if: inputs.ksu_mode == 'Disabled'
        continue-on-error: true
        run: |
          # All upstream susfs4ksu-module Actions artifacts have expired,
          # so the module is now published through GitHub Releases; fetch the latest Release asset instead
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "Failed to fetch Release information; retrying ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "Could not fetch the latest susfs4ksu-module Release information"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No ksu_module_susfs module ZIP found in Release $TAG_NAME"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "Downloading SUSFS module: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "Failed to download SUSFS module: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Validate and extract to the module directory; the downloaded artifact is the module itself, so do not add another ZIP layer
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "The downloaded SUSFS module ZIP is corrupted"
            exit 1
          fi
          rm -rf susfs-module && mkdir -p susfs-module
          unzip -oq "$NAME" -d susfs-module
          rm -f "$NAME"
          [ -f susfs-module/module.prop ] || { echo "SUSFS module is missing module.prop"; exit 1; }
          ls -la susfs-module/

      - name: Download NoMount module
        id: add_nomount
        if: inputs.use_nomount && inputs.ksu_mode != 'Disable KernelSU'
        continue-on-error: true
        run: |
          # NoMount is released as a mount meta-module; when use_nomount is enabled, fetch the latest module ZIP
          RELEASE_API="https://api.github.com/repos/maxsteeel/nomount/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "Failed to fetch NoMount Release information; retrying ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "Could not fetch the latest NoMount Release information"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No NoMount module ZIP found in Release $TAG_NAME"
            exit 1
          fi
          ASSET_NAME=$(basename "$ASSET_URL")

          echo "Downloading NoMount module: $ASSET_NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 180 -o "$ASSET_NAME" "$ASSET_URL"; then
            echo "Failed to download NoMount module: $ASSET_URL"
            exit 1
          fi
          echo "NOMOUNT_NAME=$TAG_NAME" >> $GITHUB_ENV

          if ! unzip -t "$ASSET_NAME" >/dev/null 2>&1; then
            echo "The downloaded NoMount module ZIP is corrupted"
            exit 1
          fi
          rm -rf nomount-module && mkdir -p nomount-module
          unzip -oq "$ASSET_NAME" -d nomount-module
          rm -f "$ASSET_NAME"
          [ -f nomount-module/module.prop ] || { echo "NoMount module is missing module.prop"; exit 1; }
          ls -la nomount-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "Failed to download the CI-built KSU!"

      - name: Build Summary
        if: always()
        run: |
          VARIANT="${{ inputs.kernelsu_variant }}"
          MANAGER_VER="${{ steps.add_KSU.outputs.managerVer }}"
          if [ "${{ inputs.ksu_mode }}" = "Disable KernelSU" ]; then
            MANAGER_VER="Not integrated"
          fi
          [ -n "$MANAGER_VER" ] || MANAGER_VER="Not retrieved"

          case "${CHANNEL_KIND:-}" in
            latest) CH_LABEL="Latest channel (HEAD)" ;;
            *)      CH_LABEL="Stable channel (Release)" ;;
          esac

          flag() { [ "$1" = "true" ] && echo "✅ Enabled" || echo "➖ Disabled"; }

          if [ "${{ inputs.ksu_mode }}" = "Disabled" ]; then
            SUS_ROW="✅ Enabled"
          else
            SUS_ROW="⛔ Disabled"
          fi

          DS_RAW="${{ inputs.droidspaces }}"
          DS_SLOT="${DS_RAW%% *}"
          if [ -z "$DS_SLOT" ] || [ "$DS_SLOT" = "off" ]; then
            DS_ROW="➖ Disabled"
          elif [ "${{ inputs.droidspaces_ntsync }}" = "true" ]; then
            DS_ROW="✅ Slot $DS_SLOT + NTSync"
          else
            DS_ROW="✅ Slot $DS_SLOT"
          fi

          if [ "${{ inputs.use_kpm }}" != "true" ]; then
            KPM_ROW="➖ Disabled"
          elif [ "$VARIANT" = "FinaSU" ]; then
            KPM_ROW="⚠️ Selected; unsupported by FinaSU (will be ignored)"
          else
            KPM_ROW="✅ Enabled"
          fi

          VER_ROW="${{ inputs.version }}"
          [ -n "$VER_ROW" ] || VER_ROW="Default"
          TIME_ROW="${{ inputs.build_time }}"
          [ -n "$TIME_ROW" ] || TIME_ROW="Automatic (current Beijing time)"

          {
            echo "## 📊 Build Summary"
            echo ""
            if [ "${{ inputs.ksu_mode }}" = "Disable KernelSU" ]; then
              echo "**KernelSU not integrated** · $CH_LABEL"
            else
              echo "**$VARIANT** · Manager \`$MANAGER_VER\` · $CH_LABEL"
            fi
            echo ""
            echo "### ⚙️ Build Options"
            echo ""
            echo "| Feature | Selection |"
            echo "|:---|:---|"
            echo "| SUSFS | $SUS_ROW |"
            echo "| Droidspaces containers | $DS_ROW |"
            echo "| ZRAM compression | $(flag "${{ inputs.use_zram }}") |"
            echo "| BBG baseband protection | $(flag "${{ inputs.use_bbg }}") |"
            echo "| Network enhancements | $(flag "${{ inputs.use_net_enhance }}") |"
            echo "| Re-Kernel driver | $(flag "${{ inputs.use_rekernel }}") |"
            echo "| KPM | $KPM_ROW |"
            echo "| NoMount meta-module | $(flag "${{ inputs.use_nomount }}") |"
            echo "| \`CVE-2026-43499\` fix | $(flag "${{ inputs.cve_2026_43499_patch }}") |"
            echo "| Skip incompatible features | $(flag "${{ inputs.skip_incompatible }}") |"
            echo "| Artifact upload mode | ${{ inputs.artifact_upload_mode }} |"
            echo "| Custom version name | ${VER_ROW} |"
            echo "| Custom build time | ${TIME_ROW} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: Upload SUSFS module
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/

      - name: Upload NoMount module
        if: inputs.use_nomount && steps.add_nomount.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: nomount-${{ env.NOMOUNT_NAME }}
          path: ./nomount-module/
