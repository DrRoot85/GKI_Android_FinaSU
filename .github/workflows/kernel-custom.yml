      # ==================== KernelSU configuration ====================
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - SukiSU-Nova
          - BakaSU
          - FinaSU
        default: FinaSU

      build_channel:
        description: "Manager build channel"
        required: false
        type: choice
        options:
          - "Release"
          - "Latest (HEAD)"
        default: "Release"

      # ==================== Optional configuration ====================
      version:
        description: "Custom kernel version name"
        required: false
        type: string
      build_time:
        description: "Custom build timestamp (leave empty to automatically use the current Beijing time; example: Tue Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""

      # ==================== Option configuration ====================
      use_kpm:
        description: "Enable KPM (SukiSU-Nova only; enabled without patching)"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patches, 6.12: on/off; options with NTSync also inject NTSync)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
          - "678 (NTSync)"
          - "123 (NTSync)"
          - "345 (NTSync)"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload all"
        default: "AnyKernel3.zip only"
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        required: true
        type: choice
        options:
          - "Off"
          - "Disable SUSFS"
          - "Disable KSU"
        default: "Off"

      # ==================== Feature switches ====================
      use_zram:
        description: "Enable ZRAM compression algorithms (5.10~6.6 only; not supported on 6.12/6.18)"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband protection"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel drivers"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable the NoMount mount subsystem (requires the companion module to be flashed separately)"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 RT-mutex fix chain"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus Snapdragon 8 Elite/Gen5 support"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip incompatible or unavailable features instead of stopping the build"
        required: false
        type: boolean
        default: true

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
    steps:
      - name: Check out version data
        uses: actions/checkout@v7

      - name: Resolve security patch level
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          SUB_LEVEL_A12_5_10: ${{ inputs.sub_level_a12_5_10 }}
          SUB_LEVEL_A13_5_10: ${{ inputs.sub_level_a13_5_10 }}
          SUB_LEVEL_A13_5_15: ${{ inputs.sub_level_a13_5_15 }}
          SUB_LEVEL_A14_5_15: ${{ inputs.sub_level_a14_5_15 }}
          SUB_LEVEL_A14_6_1: ${{ inputs.sub_level_a14_6_1 }}
          SUB_LEVEL_A15_6_6: ${{ inputs.sub_level_a15_6_6 }}
          SUB_LEVEL_A16_6_12: ${{ inputs.sub_level_a16_6_12 }}
          SUB_LEVEL_A17_6_18: ${{ inputs.sub_level_a17_6_18 }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
              "6.18": "android17",
          }
          # One kernel version may have multiple Android versions (android13-5.10, android14-5.15, etc.),
          # decided by the sub-version dropdown of the matching combination: selecting a non-auto item builds for that Android version;
          # when all stay auto, the default mapping is used.
          android_candidates = {
              "5.10": ["android12", "android13"],
              "5.15": ["android13", "android14"],
              "6.1": ["android14"],
              "6.6": ["android15"],
              "6.12": ["android16"],
              "6.18": ["android17"],
          }
          candidates = android_candidates.get(kernel_version)
          if not candidates:
              print(f"::error::Unsupported kernel version: {kernel_version}")
              sys.exit(1)

          def sub_level_key(android):
              return "SUB_LEVEL_A%s_%s" % (
                  android.replace("android", ""), kernel_version.replace(".", "_"))

          selected = []
          for android in candidates:
              value = os.environ.get(sub_level_key(android), "").strip()
              if value and not value.startswith("auto"):
                  selected.append((android, value))

          if len(selected) > 1:
              print("::warning::Sub-versions of multiple Android versions were selected at the same time: "
                    + ", ".join("%s=%s" % item for item in selected)
                    + f", using {selected[0][0]}")
          if selected:
              android_version, sub_level_input = selected[0]
          else:
              android_version = android_map[kernel_version]
              sub_level_input = os.environ.get(sub_level_key(android_version), "").strip()
              if not sub_level_input:
                  print(f"::warning::{sub_level_key(android_version)} is not set; falling back to auto")

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::Version data not found: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          # Look up the security patch level by sub-version (sub_level_input has been determined from the Android candidates above)
          if sub_level_input and not sub_level_input.startswith("auto"):
              # Look up the security patch level by sub-version, e.g. "138 (2025-06)" -> 2025-06
              token = sub_level_input.split()[0]
              if token == "lts":
                  kernel_full = data.get("lts")
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} is missing LTS version data")
                      sys.exit(1)
                  sub_level = "X"
                  patch_level = "lts"
              elif token.isdigit():
                  matches = [
                      entry for entry in data.get("entries", [])
                      if entry.get("kernel") == f"{kernel_version}.{token}"
                  ]
                  if not matches:
                      # When one kernel version spans multiple Android versions, the dropdown may not contain the sub-version
                      # of the current combination; fall back to the latest monthly entry of that combination, to avoid a hard failure
                      entries = data.get("entries", [])
                      if not entries:
                          print(f"::error::{android_version} / {kernel_version} has no usable version data")
                          sys.exit(1)
                      latest = entries[-1]
                      kernel_full = latest.get("kernel", "")
                      patch_level = latest.get("date", "")
                      sub_level = kernel_full.rsplit(".", 1)[-1]
                      print(f"::warning::{android_version} / {kernel_version}.{token} has no matching data; falling back to {kernel_full} ({patch_level})")
                  else:
                      # entries are in ascending date order; take the latest security patch level for that sub-version
                      latest = matches[-1]
                      kernel_full = latest.get("kernel", "")
                      patch_level = latest.get("date", "")
                      sub_level = token
              else:
                  print(f"::error::Unrecognized sub-version: {sub_level_input}")
                  sys.exit(1)
          else:
              # auto: take the latest monthly ASB entry in the version data (the data is continuously refreshed by update_data.py)
              entries = data.get("entries", [])
              if not entries:
                  print(f"::error::{android_version} / {kernel_version} has no usable version data")
                  sys.exit(1)
              latest = entries[-1]
              kernel_full = latest.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::Invalid version data: {kernel_full} does not belong to {kernel_version}")
                  sys.exit(1)
              patch_level = latest.get("date", "")
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")
              output.write(f"os_patch_level={patch_level}\n")

          print(f"Resolved: {android_version} / {kernel_full} / patch level {patch_level}, sub-level: {sub_level}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ needs.resolve-version.outputs.os_patch_level }}"
    needs: [resolve-version, get-ksu-manager]
    # A manager fetch failure does not block the kernel build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ needs.resolve-version.outputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      # Kernel-side KernelSU is checked out at the same commit as the latest officially uploaded Manager build,
      # so the kernel KSU version matches the fetched manager package exactly (effective for BakaSU / FinaSU)
      ksu_commit: ${{ needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm || false }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # First fetch the latest officially uploaded Manager build and output its commit SHA, so the kernel build can align with it
  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
