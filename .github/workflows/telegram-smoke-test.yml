name: Telegram Smoke Test

on:
  push:
    branches:
      - feat/ksu_susfs
    paths:
      - .github/workflows/telegram-smoke-test.yml

permissions:
  contents: read

jobs:
  send-test-message:
    if: contains(github.event.head_commit.message, '[telegram-smoke-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Send one test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004456803688"
          TEST_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              print("::error::TELEGRAM_BOT_TOKEN secret is not configured.")
              sys.exit(1)

          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": f"Telegram test from GKI_Android_FinaSU (commit {os.environ['TEST_COMMIT'][:7]}). Please ignore.",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram rejected the test message")
          print("Test message sent to the configured Telegram channel.")
          PY
