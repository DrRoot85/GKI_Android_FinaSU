name: Kernel Build - Android 13 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
          - KernelSU
        default: FinaSU
      build_channel:
        description: "Build channel (Stable = official Release; Latest = upstream HEAD)"
        required: false
        type: choice
        options:
          - "Stable (Release)"
          - "Latest (HEAD)"
        default: "Stable (Release)"
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (leave blank to use the current Beijing time; example: Tue Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""
      use_kpm:
        description: "KPM feature (SukiSU only; enabling it leaves it unpatched)"
        required: true
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload all"
        default: "AnyKernel3.zip only"
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        required: true
        type: choice
        options:
          - "Disabled"
          - "Disable SUSFS"
          - "Disable KernelSU"
        default: "Disabled"
      droidspaces_ntsync:
        description: "Enable NTSync support for Droidspaces containers (Droidspaces must also be enabled)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "Enable the ZRAM compression algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband protection"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable the Re-Kernel driver"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable the NoMount mount metamodule (the matching module must be flashed separately)"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 rtmutex fix chain"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip incompatible or unavailable features without stopping the build"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "Build channel (passed from main.yml; when triggered directly, uses the manager source selected by this workflow)"
        required: false
        type: string
        default: "Stable (Release)"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: ""
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: "Disabled"
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload all"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        required: false
        type: boolean
        default: true
      called_from_main:
        description: "Whether this was called from main.yml (internal use)"
        required: false
        type: boolean
        default: false
      ksu_commit:
        description: "KernelSU commit for the latest official uploaded build (passed from main.yml; when triggered directly, uses the manager build selected by this workflow)"
        required: false
        type: string
        default: ""

      ksu_cert_size:
        description: "FinaSU manager signing certificate DER size (passed from main.yml; when triggered directly, uses the certificate fetched by this workflow)"
        required: false
        type: string
        default: ""

      ksu_cert_hash:
        description: "FinaSU manager signing certificate SHA256 (passed from main.yml; when triggered directly, uses the certificate fetched by this workflow)"
        required: false
        type: string
        default: ""

      manager_ver:
        description: "Manager versionCode (passed from main.yml; when triggered directly, uses the manager version fetched by this workflow)"
        required: false
        type: string
        default: ""

jobs:
  build-kernels-a13-5-10:
    name: "5.10.${{ matrix.display_sub || matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: get-ksu-manager
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "107"
            os_patch_level: "2022-11"
          - sub_level: "149"
            os_patch_level: "2023-01"
          - sub_level: "157"
            os_patch_level: "2023-03"
          - sub_level: "168"
            os_patch_level: "2023-05"
          - sub_level: "177"
            os_patch_level: "2023-07"
          - sub_level: "186"
            os_patch_level: "2023-09"
          - sub_level: "189"
            os_patch_level: "2023-11"
          - sub_level: "198"
            os_patch_level: "2024-01"
          - sub_level: "205"
            os_patch_level: "2024-03"
          - sub_level: "209"
            os_patch_level: "2024-05"
          - sub_level: "210"
            os_patch_level: "2024-06"
          - sub_level: "214"
            os_patch_level: "2024-07"
          - sub_level: "218"
            os_patch_level: "2024-08"
          - sub_level: "223"
            os_patch_level: "2024-11"
          - sub_level: "228"
            os_patch_level: "2025-01"
          - sub_level: "234"
            os_patch_level: "2025-03"
          - sub_level: "236"
            os_patch_level: "2025-05"
          - sub_level: "238"
            os_patch_level: "2025-07"
          - sub_level: "243"
            os_patch_level: "2025-10"
          - sub_level: "246"
            os_patch_level: "2026-01"
          - sub_level: "252"
            os_patch_level: "2026-04"
          - sub_level: "257"
            os_patch_level: "2026-07"
          - sub_level: "269"
            os_patch_level: "2026-10"
          - sub_level: "X"
            os_patch_level: "lts"
            display_sub: "272"

    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      display_sub: ${{ matrix.display_sub || '' }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ inputs.ksu_cert_size || needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ inputs.ksu_cert_hash || needs.get-ksu-manager.outputs.managerCertHash }}
      manager_ver: ${{ inputs.manager_ver || needs.get-ksu-manager.outputs.managerVer }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm || false }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KernelSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # Run only when triggered directly; skip when called from main.yml
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
