# ========================================
# Main entry point of the GKI kernel build
# ========================================
# This workflow is the project's unified entry point, used to:
# 1. Build GKI kernels for all versions
# 2. Fetch the latest KSU manager
# 3. Collect patch conflict files and compile failure logs for debugging
# 4. Create a GitHub Release (optional)
# ========================================

name: Build kernel

# Concurrency control: only one instance runs per branch, and a new run cancels the old one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Release configuration ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU configuration ====================
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - SukiSU-Nova
          - BakaSU
          - FinaSU
        default: FinaSU

      build_channel:
        description: "Manager build channel"
        type: choice
        options:
          - "Release"
          - "Latest (HEAD)"
        default: "Release"

      # ==================== Optional configuration ====================
      version:
        description: "Custom kernel version name"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build timestamp (leave empty to automatically use the current Beijing time; example: Tue Dec  1 08:10:00 UTC 2026)"
        type: string
        default: ""
        required: false
      # ==================== Option configuration ====================
      use_kpm:
        description: "Enable KPM (SukiSU-Nova only; enabled without patching)"
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patches, 6.12: on/off; options with NTSync also inject NTSync)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
          - "678 (NTSync)"
          - "123 (NTSync)"
          - "345 (NTSync)"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload all"
        default: "AnyKernel3.zip only"
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        type: choice
        options:
          - "Off"
          - "Disable SUSFS"
          - "Disable KSU"
        default: "Off"

      # ==================== Feature switches ====================
      use_zram:
        description: "Enable ZRAM compression algorithms (5.10~6.6 only; not supported on 6.12/6.18)"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband protection"
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel drivers"
        type: boolean
        default: false
      use_nomount:
        description: "Enable the NoMount mount subsystem (requires the companion module to be flashed separately)"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the CVE-2026-43499 RT-mutex fix chain"
        type: boolean
        default: false

      # ==================== Compatibility ====================
      skip_incompatible:
        description: "Automatically skip incompatible or unavailable features instead of stopping the build"
        type: boolean
        default: true

      # ==================== Build version selection ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_10:
        description: "Android 13 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_5_15:
        description: "Android 14 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_a17_6_18:
        description: "Android 17 - 6.18 (SUSFS not supported; always disabled)"
        type: boolean
        default: false
      build_all:
        description: "Build all versions"
        type: boolean
        default: true

jobs:
  # ==================== Get manager ====================
  # Download the latest KernelSU manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_nomount: ${{ inputs.use_nomount }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}

  # ==================== Android 12 - 5.10 build ====================
  build-a12-5-10:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a12_5_10 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 13 - 5.10 build ====================
  build-a13-5-10:
    needs: [get-manager]
    # A manager fetch failure does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a13_5_10 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a13-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 13 - 5.15 build ====================
  build-a13-5-15:
