      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Collect Patch-Reject Files ====================
  # Aggregate .rej files from all build jobs to help debug patch issues
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18
    steps:
      - name: Download patch-reject files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process patch-reject files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload aggregated patch-reject files
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== Collect Build Failure Logs ====================
  # Aggregate failure logs by build name for easier downloading and troubleshooting
  collect-build-logs:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18
    steps:
      - name: Download build failure logs
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-build-logs
          pattern: '*-Build-Logs'
          merge-multiple: false

      - name: Process build failure logs
        run: |
          mkdir -p aio-build-logs
          found_logs=false
          for dir in ./downloaded-build-logs/*-Build-Logs; do
            [ -d "$dir" ] || continue
            artifact_name=$(basename "$dir")
            mkdir -p "aio-build-logs/$artifact_name"
            cp -r "$dir/." "aio-build-logs/$artifact_name/"
            found_logs=true
          done

          # When download-artifact matches only one artifact, it extracts it directly into the target directory
          if [ "$found_logs" = false ] && [ -f ./downloaded-build-logs/artifact-name.txt ]; then
            read -r artifact_name < ./downloaded-build-logs/artifact-name.txt
            artifact_name=$(basename "$artifact_name")
            if [ -n "$artifact_name" ]; then
              mkdir -p "aio-build-logs/$artifact_name"
              cp -r ./downloaded-build-logs/. "aio-build-logs/$artifact_name/"
            fi
          fi

          if [ "$(ls -A aio-build-logs 2>/dev/null)" ]; then
            cd aio-build-logs
            zip -r -q -9 ../AIO-BUILD-LOGS.zip .
          fi

      - name: Upload aggregated build failure logs
        id: upload_aggregated_build_logs
        uses: actions/upload-artifact@v6
        with:
          name: AIO-BUILD-LOGS
          path: AIO-BUILD-LOGS.zip
          if-no-files-found: ignore

      - name: Delete individual build failure logs
        if: steps.upload_aggregated_build_logs.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete intermediate artifacts after the aggregate upload succeeds to avoid using storage twice
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith("-Build-Logs")) | .id'); then
            echo "::warning::Failed to get the list of individual build failure logs; skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate log artifact: $artifact_id"
            else
              echo "::warning::Failed to delete intermediate log artifact $artifact_id"
            fi
          done <<< "$ARTIFACT_IDS"

  # ==================== Create Release ====================
  # Create a GitHub Release when release_type is not Actions
  # When Actions is selected as the release type, upload artifacts only; do not create a Release
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-a17-6-18

    # ==================== Environment Variables ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      # ==================== Set Display Names ====================
      # Precompute display names to simplify later references
      - name: Set Display Names
        run: |
          # KSU display name
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU")    KSU_NAME="SukiSU" ;;
            "BakaSU")  KSU_NAME="BakaSU" ;;
            "FinaSU")  KSU_NAME="FinaSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # Version information (when the kernel is aligned with the official uploaded build, its KSU version equals managerVer;
          # fall back to ksuVer if managerVer is empty (manager download failed))
          KSU_VER="${{ needs.get-manager.outputs.managerVer }}"
          if [ -z "$KSU_VER" ]; then
            KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          fi
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # Feature toggle status
          echo "LZ4_STATUS=${{ inputs.use_zram && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "REKERNEL_STATUS=${{ inputs.use_rekernel && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "KPM_STATUS=${{ inputs.use_kpm && 'Enabled (unpatched)' || 'Disabled' }}" >> $GITHUB_ENV

          # Droidspaces container support (including NTSync)
          if [ "${{ inputs.droidspaces }}" = "off" ]; then
            echo "DROIDSPACES_STATUS=Disabled" >> $GITHUB_ENV
          elif [[ "${{ inputs.droidspaces }}" == *NTSync* ]]; then
            echo "DROIDSPACES_STATUS=Enabled (NTSync)" >> $GITHUB_ENV
          else
            echo "DROIDSPACES_STATUS=Enabled" >> $GITHUB_ENV
          fi

          # Network enhancements (BBRv3 / IPSet / Qdisc / CIFS)
          echo "NET_ENHANCE_STATUS=${{ inputs.use_net_enhance && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV

          # Hook type
          echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV

          # Mount type (FinaSU uses a metamodule architecture)
          if [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "MOUNT_TYPE=Metamodule" >> $GITHUB_ENV
          else
            echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV
          fi

          echo "CHANNEL_TAG=${{ needs.get-manager.outputs.channelTag }}" >> $GITHUB_ENV
          echo "CHANNEL_NAME=${{ inputs.build_channel }}" >> $GITHUB_ENV

          # Release title and body heading
          echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV
          echo "RELEASE_HEADER=**${KSU_NAME} ${KSU_VER}** + **SUSFS ${SUS_VER}**" >> $GITHUB_ENV

          # KernelSU / SUSFS mode overrides (the last value written to GITHUB_ENV takes effect)
          case "${{ inputs.ksu_mode }}" in
            "Disable KernelSU")
              echo "KSU_NAME=Not integrated" >> $GITHUB_ENV
              echo "KSU_VER=-" >> $GITHUB_ENV
              echo "SUS_VER=Not integrated" >> $GITHUB_ENV
              echo "HOOK_TYPE=None" >> $GITHUB_ENV
              echo "MOUNT_TYPE=None" >> $GITHUB_ENV
              echo "BRANCH_INFO=-" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: Clean build (no KernelSU / SUSFS)" >> $GITHUB_ENV
              echo "RELEASE_HEADER=**Clean GKI kernel** (KernelSU / SUSFS not integrated)" >> $GITHUB_ENV
              ;;
            "Disable SUSFS")
              echo "SUS_VER=Not integrated" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} (no SUSFS)" >> $GITHUB_ENV
              echo "RELEASE_HEADER=**${KSU_NAME} ${KSU_VER}** (SUSFS not integrated)" >> $GITHUB_ENV
              ;;
          esac

      # ==================== Validate Build Status ====================
      # Ensure that all selected build jobs completed successfully
      - name: Validate Build Status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_10 || inputs.build_all }}" "build-a13-5-10" "${{ needs.build-a13-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_5_15 || inputs.build_all }}" "build-a14-5-15" "${{ needs.build-a14-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          check_build "${{ inputs.build_a17_6_18 || inputs.build_all }}" "build-a17-6-18" "${{ needs.build-a17-6-18.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      # ==================== Check Out Source ====================
      - name: Check Out Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # ==================== Determine KSU Reference ====================
      # Determine the upstream KernelSU reference based on the build logic
      - name: Determine KSU Reference
        if: inputs.ksu_mode != 'Disable KernelSU'
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU")
              if [ "${{ inputs.ksu_mode }}" = "Disabled" ]; then
                BRANCH="builtin"
              else
                BRANCH="main"
              fi
              ;;
            "BakaSU") BRANCH="main" ;;
            "FinaSU") BRANCH="master" ;;
            *) echo "Error: unknown variant" >&2; exit 1 ;;
          esac
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV

      # ==================== Get KernelSU Commit Information ====================
      # Get Git commit information for the KernelSU version currently in use
      - name: Get KernelSU Commit Information
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "BakaSU") REPO_URL="https://github.com/Baka-SU/BakaSU.git"; REPO_URL2="Baka-SU/BakaSU" ;;
            "FinaSU") REPO_URL="https://github.com/LyraVoid/FinaSU.git"; REPO_URL2="LyraVoid/FinaSU" ;;
          esac

          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] && [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2)
            CUSTOM_COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ] && [ -n "${CHANNEL_TAG:-}" ]; then
            # Stable channel: use the commit referenced by the Release tag (dereference annotated tags first)
            COMMIT_HASH=$(git ls-remote $REPO_URL "refs/tags/${CHANNEL_TAG}^{}" | awk '{ print $1 }')
            if [ -z "$COMMIT_HASH" ]; then
              COMMIT_HASH=$(git ls-remote $REPO_URL "refs/tags/${CHANNEL_TAG}" | awk '{ print $1 }')
            fi
            if [ -n "$COMMIT_HASH" ]; then
              KSU_REF=$COMMIT_HASH
              KSU_URL="https://github.com/$REPO_URL2/releases/tag/$CHANNEL_TAG"
              echo "BRANCH_INFO=release/${CHANNEL_TAG}" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      # ==================== Get SUSFS Commit Information ====================
      # Get Git commit information for each SUSFS version
      - name: Get SUSFS Commit Information
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_10"]="gki-android13-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_5_15"]="gki-android14-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      # ==================== Generate Release Notes ====================
      # Create detailed release notes
      - name: Generate Release Notes
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_10 || inputs.build_all }}" "Android 13 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_5_15 || inputs.build_all }}" "Android 14 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          append_target "${{ inputs.build_a17_6_18 || inputs.build_all }}" "Android 17 / 6.18"
          if [[ -z "$build_targets" ]]; then
            build_targets="None selected"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_10 || inputs.build_all }}" "Android 13 / 5.10" "${COMMIT_HASH_gki_android13_5_10}" "${COMMIT_URL_gki_android13_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ inputs.build_a14_5_15 || inputs.build_all }}" "Android 14 / 5.15" "${COMMIT_HASH_gki_android14_5_15}" "${COMMIT_URL_gki_android14_5_15}"
          append_susfs_commit "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [ "${{ inputs.ksu_mode }}" != "Disabled" ]; then
            echo "- SUSFS was not integrated in this build" > susfs_commits.md
          elif [[ ! -s susfs_commits.md ]]; then
            echo "- No SUSFS commit information was retrieved for this build" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          $RELEASE_HEADER

          | Item | Details |
          |:---|:---|
          | Release type | ${{ inputs.release_type }} |
          | Build channel | $CHANNEL_NAME |
          | Release time | $BUILD_DATE |
          | Build targets | $build_targets |

          ### Build Configuration

          | Item | Details |
          |:---|:---|
          | KernelSU variant | $KSU_NAME |
          | KernelSU version | $KSU_VER |
          | KernelSU branch | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook type | $HOOK_TYPE |
          | Mount type | $MOUNT_TYPE |
          | LTO | thin |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | BBG baseband protection | $BBG_STATUS |
          | Network enhancements (BBRv3 / IPSet / Qdisc / CIFS) | $NET_ENHANCE_STATUS |
          | Re-Kernel driver | $REKERNEL_STATUS |
          | KPM | $KPM_STATUS |
          | Droidspaces container support | $DROIDSPACES_STATUS |

          ### Download Instructions

          Download the appropriate files from **Assets** below.

          | File type | Purpose |
          |:---|:---|
          | \`*-AnyKernel3.zip\` | AnyKernel3 flashable kernel package |
          | \`*.img\` | boot, vendor_boot, and other image files |
          | \`*.apk\` | Root manager |
          | \`susfs-*.zip\` | SUSFS companion module |

          > [!IMPORTANT]
          > Back up the stock boot image before flashing.
          > If the device fails to boot, restore the stock image first, then collect KernelSU logs for a bug report.

          <details>
          <summary>After Flashing</summary>

          ### Successful Boot

          After installing or updating the KernelSU manager, verify that root, modules, and SUSFS are working correctly.

          ### Boot Failure

          1. Restore the stock boot image
          2. Use the KernelSU manager or recovery to collect logs
          3. Open an [Issue](${{ github.server_url }}/${{ github.repository }}/issues) and include the device model, Android version, kernel version, and flashed file name

          </details>

          <details>
          <summary>Upstream Commit Information</summary>

          **KernelSU**

          - $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)

          **SUSFS4KSU**

          $(cat susfs_commits.md)

          </details>

          ---

          Recommended module: https://github.com/sidex15/ksu_module_susfs

          For the Unicode zero-width bypass fix, use the Xposed module: https://github.com/5ec1cff/FuseFixer
          EOF

      # ==================== Generate Release Tag ====================
      # Generate an incrementing release tag based on the SUSFS version
      - name: Generate Release Tag
        run: |
          # Get the SUSFS version, using a default if get-manager was skipped
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: SUSFS version was not retrieved; using the default version"
            SUS_VERSION="1.0.0"
          fi

          # Query the latest full tag with retries; fall back to empty on failure
          FULL_TAG=""
          for i in 1 2 3; do
            FULL_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null) && [ -n "$FULL_TAG" ] && break
            FULL_TAG=""
            sleep 3
          done

          if [ -n "$FULL_TAG" ] && [ "$(echo "$FULL_TAG" | sed 's/-.*//')" = "$SUS_VERSION" ]; then
            BASE_TAG="$FULL_TAG"
          else
            BASE_TAG="$SUS_VERSION-r0"
          fi

          NEW_TAG=$(echo "$BASE_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

          # Guard against malformed tags (e.g. "-r1" when the lookup failed)
          if [[ ! "$NEW_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Tag generation failed; falling back to $SUS_VERSION-r1"
            NEW_TAG="$SUS_VERSION-r1"
          fi
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated tag: $NEW_TAG"

      # ==================== Download Build Artifacts ====================
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      # ==================== Create GitHub Release ====================
      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          for i in 1 2 3; do
            if gh release view "$NEW_TAG" > /dev/null 2>&1; then
              echo "Release $NEW_TAG already exists; skipping creation"
              break
            fi
            if gh release create "$NEW_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release_body.md \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG; then
              break
            fi
            [ "$i" = 3 ] && exit 1
            echo "Failed to create Release; retrying in 10 seconds ($i/3)..."
            sleep 10
          done

      # ==================== Upload Manager and Modules ====================
      - name: Upload Manager and Modules
        continue-on-error: true
        run: |
          echo "Preparing APKs and modules for upload..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          nomount_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/nomount-*/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          echo "NoMount files: ${nomount_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          # Module artifacts contain extracted files; repackage them as flashable ZIPs for the release, using the artifact name as the filename
          for dir in ./downloaded-artifacts/susfs-* ./downloaded-artifacts/nomount-*; do
            [ -d "$dir" ] || continue
            MOD_ZIP="$PWD/downloaded-artifacts/$(basename "$dir").zip"
            rm -f "$MOD_ZIP"
            (cd "$dir" && zip -r -q -9 "$MOD_ZIP" .)
            gh release upload "$NEW_TAG" "$MOD_ZIP" || true
          done

      # ==================== Upload Kernel Artifacts ====================
      - name: Upload Kernel Artifacts
        run: |
          # In AnyKernel3.zip-only mode, package the loose flashable files into a complete AnyKernel3 ZIP and upload only the ZIP,
          # to avoid conflicts between identically named loose files (Image/anykernel.sh, etc.) from different versions;
          # Upload all mode (directories already contain ZIP and image files) continues to upload files individually.
          # --clobber overwrites assets with matching names when a job is rerun instead of failing.
          for dir in ./downloaded-artifacts/*/; do
            [ -d "$dir" ] || continue
            dir="${dir%/}"
            case "$dir/" in
              *-Build-Logs/|*-Rejects/|*Manager*/|*susfs-*/|*nomount-*/) continue ;;
            esac
            # Process only kernel flash packages: AnyKernel3.zip-only mode contains anykernel.sh; Upload all mode contains *-AnyKernel3.zip
            if [ ! -f "$dir/anykernel.sh" ] && ! ls "$dir"/*-AnyKernel3.zip >/dev/null 2>&1; then
              continue
            fi
            if ! ls "$dir"*.zip >/dev/null 2>&1; then
              (cd "$dir" && zip -r -q -9 "$(basename "$dir").zip" .)
              echo "Uploading $(basename "$dir").zip..."
              gh release upload "$NEW_TAG" "$dir/$(basename "$dir").zip" --clobber
            else
              for file in "$dir"*; do
                [ -f "$file" ] || continue
                echo "Uploading $file..."
                gh release upload "$NEW_TAG" "$file" --clobber
              done
            fi
          done

      # ==================== Build summary ====================
      - name: Build summary
        run: |
          echo "## Release created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY

      - name: Send release announcement and assets to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004456803688"
        run: |
          export RELEASE_TITLE="$RELEASE_NAME"
          export RELEASE_TAG="$NEW_TAG"
          export RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$NEW_TAG"
          python3 scripts/telegram_release.py
